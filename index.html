<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAE Gratuity Calculator - Quick & Free</title>

    <!-- Google AdSense Verification Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1589818037936447"
         crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 420px; width: 100%; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        label { font-weight: 600; color: #34495e; display: block; margin-top: 15px; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; margin-top: 20px; cursor: pointer; }
        button:hover { background: #219150; }
        .result-box { margin-top: 20px; padding: 15px; background: #e8f8f5; border: 1px solid #a3e4d7; border-radius: 6px; text-align: center; }
        .result-amount { font-size: 24px; font-weight: bold; color: #27ae60; margin-top: 5px; }
        .support-btn { display: block; text-align: center; margin-top: 25px; padding: 10px; background: #ffdd00; color: #000; font-weight: bold; text-decoration: none; border-radius: 6px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🇦🇪 UAE Gratuity Calculator</h2>
    
    <label for="basicSalary">Monthly Basic Salary (AED)</label>
    <input type="number" id="basicSalary" placeholder="e.g. 8000">

    <label for="years">Years of Service</label>
    <input type="number" id="years" placeholder="e.g. 3.5" step="0.1">

    <button onclick="calculateGratuity()">Calculate Estimate</button>

    <div class="result-box" id="resultBox" style="display:none;">
        <div>Estimated Gratuity Pay:</div>
        <div class="result-amount" id="gratuityResult">0 AED</div>
    </div>

    <!-- Monetization Link -->
    <a href="https://buymeacoffee.com" target="_blank" class="support-btn">☕ Buy Me a Coffee (Support this tool)</a>
</div>

<script>
function calculateGratuity() {
    let salary = parseFloat(document.getElementById('basicSalary').value);
    let years = parseFloat(document.getElementById('years').value);
    
    if (isNaN(salary) || isNaN(years) || salary <= 0 || years < 1) {
        alert("Please enter a valid salary and at least 1 year of service.");
        return;
    }

    let dailyRate = salary / 30;
    let totalGratuity = 0;

    if (years <= 5) {
        totalGratuity = dailyRate * 21 * years;
    } else {
        let firstFiveYears = dailyRate * 21 * 5;
        let remainingYears = dailyRate * 30 * (years - 5);
        totalGratuity = firstFiveYears + remainingYears;
    }

    // Cap at 2 years total salary under UAE labor law
    let maxCap = salary * 24;
    if (totalGratuity > maxCap) totalGratuity = maxCap;

    document.getElementById('gratuityResult').innerText = totalGratuity.toFixed(2) + " AED";
    document.getElementById('resultBox').style.display = "block";
}
</script>

</body>
</html>
